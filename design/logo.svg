<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- agent-sync 品牌标识：单源辐射（碳黑 · 琥珀源节点 · 三色端点） -->
  <defs>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#ffb224" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb224" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0b0c0e"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- 源节点 -->
  <rect x="84" y="188" width="136" height="136" rx="30" fill="none" stroke="#ffb224" stroke-width="28"/>
  <rect x="128" y="232" width="48" height="48" rx="12" fill="#ffb224"/>
  <!-- 辐射连线 -->
  <path d="M232 256 C 296 256, 316 128, 392 128" stroke="#ffb224" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M232 256 C 296 256, 316 256, 392 256" stroke="#ffb224" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M232 256 C 296 256, 316 384, 392 384" stroke="#ffb224" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- 端点（琥珀=源 · 绿=健康 · 米白=端） -->
  <circle cx="416" cy="128" r="26" fill="#ffb224"/>
  <circle cx="416" cy="256" r="26" fill="#3ddc97"/>
  <circle cx="416" cy="384" r="26" fill="#e9e4d8"/>
</svg>
